[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcs-hitl-context"
version = "0.1.0"
description = "TCS Agentic AI Platform — HITL Context Framework"
readme = "docs/framework.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]
