<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Option C — Icon rail</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f7f6f1;color:#1f2a3a}
  .app{display:grid;grid-template-rows:48px 1fr 64px;height:100vh}
  .status{background:#102542;color:#fff;display:flex;align-items:center;padding:0 20px;font-size:13px}
  .main{display:grid;grid-template-columns:48px 1fr 32px;border-top:1px solid #d9dee6}
  .rail{background:#102542;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;font-size:18px}
  .rail span{cursor:pointer;opacity:0.7}
  .rail span:hover{opacity:1}
  .envelope{padding:16px;overflow:auto;font-size:12px}
  .envelope .panel{background:#fff;border:1px solid #d9dee6;border-radius:4px;padding:10px;margin-bottom:8px}
  .audit-strip{background:#102542;color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 0;writing-mode:vertical-rl}
  .audit-strip span{font-family:monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase}
  .composer{background:#fff;border-top:1px solid #d9dee6;display:flex;align-items:center;padding:0 20px;font-size:12px;color:#888}
  .label{font-family:monospace;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#888;margin-bottom:6px}
</style></head>
<body><div class="app">
  <div class="status">TCS Knowledge Fabric · case-abc123 · admin</div>
  <div class="main">
    <div class="rail"><span title="Chat">&#x1F4AC;</span><span title="History">&#x1F4DC;</span><span title="Knowledge">&#x1F50D;</span><span title="Settings">&#x2699;</span></div>
    <div class="envelope">
      <div class="label">Envelope</div>
      <div class="panel">Multi-source evidence map <span style="float:right">Expand &#x2922;</span></div>
      <div class="panel">Knowledge graph <span style="float:right">Expand &#x2922;</span></div>
      <div class="panel">Stage 1 · Policy &amp; scope</div>
      <div class="panel">Stage 2 · Agent gathered</div>
      <div class="panel">Stage 3 · For your decision</div>
    </div>
    <div class="audit-strip"><span>Audit (47)</span></div>
  </div>
  <div class="composer">Ask the agent &hellip;</div>
</div></body></html>
