# fly.toml app configuration file generated for tcs-kf-neo4j on 2026-05-26T14:45:27-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tcs-kf-neo4j'
primary_region = 'iad'

[build]
  image = 'neo4j:5-community'

[env]
  NEO4J_ACCEPT_LICENSE_AGREEMENT = 'yes'
  NEO4J_server_config_strict__validation_enabled = 'false'
  NEO4J_server_default__listen__address = '0.0.0.0'
  NEO4J_server_memory_heap_initial__size = '512m'
  NEO4J_server_memory_heap_max__size = '1024m'
  NEO4J_server_memory_pagecache_size = '256m'

[[mounts]]
  source = 'neo4j_data'
  destination = '/data'

# No [[services]] block — Neo4j stays on Fly's private network only.
# The backend reaches Bolt via `tcs-kf-neo4j.internal:7687` (6PN) and
# we never expose 7687 publicly. Auth is still required (NEO4J_AUTH
# secret) as defense-in-depth.

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
