<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knowledge Fabric · Launcher wireframe</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Calibri, "Helvetica Neue", Arial, sans-serif; margin: 0; background: #f3f4f6; color: #1f2937; }
  .frame { max-width: 1100px; margin: 24px auto; background: #fff;
           border: 2px solid #1E2761; min-height: 760px; position: relative; }
  .topbar { background: #1E2761; color: #fff; padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center; }
  .topbar .brand { font-weight: 700; font-size: 14px; letter-spacing: 0.05em; }
  .topbar .step { font-size: 12px; opacity: 0.85; }
  .progress { display: flex; gap: 4px; padding: 8px 24px;
              background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
  .pdot { flex: 1; height: 4px; background: #d1d5db; border-radius: 2px; }
  .pdot.done { background: #6366f1; }
  .pdot.active { background: #1E2761; }
  .body { padding: 32px 40px 110px; min-height: 600px; position: relative; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
             color: #4f46e5; text-transform: uppercase; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; color: #1E2761;
       margin: 4px 0 8px; }
  .lede { font-size: 13px; color: #4b5563; max-width: 780px; line-height: 1.6; }
  .nav { position: absolute; bottom: 28px; left: 40px; right: 40px;
         display: flex; justify-content: space-between; }
  .btn { padding: 8px 18px; border: 1px solid #1E2761; background: #fff;
         color: #1E2761; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .btn.primary { background: #1E2761; color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .card { border: 2px dashed #d1d5db; border-radius: 6px; padding: 14px; cursor: pointer;
          transition: all 100ms; }
  .card:hover { border-color: #9ca3af; }
  .card.selected { border-style: solid; border-color: #4f46e5; background: #eef2ff; }
  .card.custom { background: linear-gradient(180deg, #fff 0%, #fefce8 100%); }
  .card.custom h3 { color: #92400e; }
  .card h3 { font-size: 13px; color: #1E2761; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .count { font-size: 11px; color: #6b7280; }
  .card ul { margin: 8px 0 0; padding-left: 16px; font-size: 11px; color: #4b5563; line-height: 1.45; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; max-width: 620px; }
  .form-row label { font-size: 10px; font-weight: 700; color: #1E2761; text-transform: uppercase; letter-spacing: 0.06em; }
  .form-row input, .form-row select {
    padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .radio-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .radio-row { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
               border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; }
  .radio-row.selected { border-color: #4f46e5; background: #eef2ff; }
  .radio-row .marker { width: 14px; height: 14px; border: 2px solid #6b7280; border-radius: 50%;
                       flex-shrink: 0; margin-top: 2px; position: relative; }
  .radio-row.selected .marker { border-color: #4f46e5; }
  .radio-row.selected .marker::after { content: ""; position: absolute; top: 2px; left: 2px;
                                       width: 6px; height: 6px; background: #4f46e5; border-radius: 50%; }
  .radio-row .title { font-size: 13px; font-weight: 600; color: #1f2937; }
  .radio-row .desc { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .ladder { display: flex; gap: 4px; }
  .ladder-cell { flex: 1; padding: 8px 6px; border: 1px solid #d1d5db; border-radius: 4px;
                 text-align: center; cursor: pointer; font-size: 11px; line-height: 1.3; }
  .ladder-cell.selected { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; font-weight: 600; }
  .ladder-cell.disabled { opacity: 0.4; cursor: not-allowed; }
  .scenario-row { padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
  .scenario-row-top { display: grid; grid-template-columns: 1fr 280px; gap: 14px; align-items: center; }
  .scenario-name { font-size: 13px; color: #1f2937; font-weight: 500; }
  .scenario-meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .grad-line { font-size: 11px; color: #6b7280; margin-top: 6px; padding-left: 0; }
  .grad-line a { color: #4f46e5; cursor: pointer; text-decoration: underline; }
  .grad-panel { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px;
                padding: 12px 14px; margin-top: 8px; }
  .grad-panel h4 { font-size: 11px; font-weight: 700; color: #1E2761;
                   margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .grad-field { display: grid; grid-template-columns: 200px 1fr; gap: 10px; align-items: center;
                font-size: 12px; padding: 5px 0; }
  .grad-field label { color: #4b5563; }
  .grad-field input[type="number"] { width: 70px; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 3px; }
  .grad-field input[type="checkbox"] { margin-right: 4px; }
  .grad-actions { margin-top: 10px; display: flex; gap: 8px; }
  .grad-actions button { font-size: 11px; padding: 4px 12px; border-radius: 3px; border: 1px solid #1E2761;
                         background: #fff; color: #1E2761; cursor: pointer; }
  .grad-actions button.primary { background: #1E2761; color: #fff; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
          font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .pill.green { background: #dcfce7; color: #166534; }
  .pill.amber { background: #fef3c7; color: #92400e; }
  .pill.red { background: #fee2e2; color: #991b1b; }
  .yaml { background: #1f2937; color: #f9fafb; padding: 16px 18px;
          font-family: "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.55;
          border-radius: 4px; max-height: 380px; overflow: auto; white-space: pre; }
  .yaml .k { color: #fbbf24; } .yaml .v { color: #93c5fd; } .yaml .c { color: #6b7280; }
  .steps-overview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
                    margin-top: 28px; }
  .step-card { padding: 14px 8px; text-align: center; border: 1px solid #e5e7eb;
               border-radius: 4px; }
  .step-card .n { font-family: Georgia; font-size: 22px; color: #1E2761; font-weight: bold; }
  .step-card .l { font-size: 11px; color: #4b5563; margin-top: 4px; line-height: 1.3; }
  .footer-tip { margin-top: 20px; font-size: 12px; color: #6b7280; line-height: 1.5; }
  .info-box { margin-top: 16px; padding: 12px 16px; background: #eef2ff; border-left: 3px solid #4f46e5;
              font-size: 12px; color: #4338ca; line-height: 1.5; border-radius: 0 4px 4px 0; }
  /* "Enables in the running instance" callout. Sits at the bottom of
     each step body to connect launcher config → demo capability without
     interrupting the configuration flow. Indigo eyebrow matches the
     authority-recalculated treatment in the running app. */
  .enables-callout { margin-top: 22px; padding: 12px 16px; background: #f5f3ff;
                     border-left: 3px solid #6366f1; border-radius: 0 4px 4px 0; }
  .enables-callout .enables-eyebrow { font-size: 10px; font-weight: 700;
                                      letter-spacing: 0.12em; color: #4338ca;
                                      text-transform: uppercase; margin-bottom: 4px; }
  .enables-callout .enables-text { font-size: 12.5px; color: #1f2937; line-height: 1.55; }
  .enables-callout .enables-text em { color: #4338ca; font-style: italic; font-weight: 600; }
  .crumb { font-size: 11px; color: #6b7280; margin-bottom: 6px; }
  .crumb a { color: #4f46e5; text-decoration: underline; cursor: pointer; }
  code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: #f3f4f6; padding: 1px 5px; border-radius: 3px; }
  /* --- post-launch admin-UI preview chrome --- */
  .preview-banner { background: #fef3c7; border: 1px solid #fbbf24; padding: 10px 14px;
                    border-radius: 4px; font-size: 11px; color: #92400e; margin-bottom: 18px;
                    display: flex; align-items: center; gap: 10px; }
  .preview-banner .icon { background: #92400e; color: #fff; width: 18px; height: 18px;
                          border-radius: 50%; display: flex; align-items: center; justify-content: center;
                          font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .preview-steps-dots { display: flex; gap: 6px; align-items: center; margin: 10px 0 18px; font-size: 11px; color: #6b7280; }
  .preview-steps-dots .pdotn { width: 22px; height: 22px; border-radius: 50%; background: #e5e7eb; color: #6b7280;
                               display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .preview-steps-dots .pdotn.done { background: #6366f1; color: #fff; }
  .preview-steps-dots .pdotn.active { background: #1E2761; color: #fff; }
  .preview-steps-dots .pline { flex: 0 0 16px; height: 1px; background: #d1d5db; }
  .preview-nav { margin-top: 22px; display: flex; gap: 8px; }
  .admin-pane { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
  .admin-pane-header { background: #1f2937; color: #fff; padding: 10px 14px;
                       display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .admin-pane-header .breadcrumb { opacity: 0.7; font-size: 11px; }
  .admin-pane-body { padding: 16px 18px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .admin-table th, .admin-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  .admin-table thead th { background: #f9fafb; font-weight: 600; color: #374151; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .admin-table tbody tr:hover { background: #fafafa; }
  .field-grid { display: grid; grid-template-columns: 160px 1fr; gap: 10px 14px; align-items: center; font-size: 12px; }
  .field-grid label { color: #4b5563; font-weight: 500; }
  .field-grid input, .field-grid select, .field-grid textarea {
    padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 3px; font-size: 12px; font-family: inherit;
  }
  .field-grid textarea { font-family: "SF Mono", Menlo, monospace; font-size: 11px; min-height: 60px; }
  .check-row { font-size: 12px; padding: 4px 0; display: flex; align-items: center; gap: 8px; }
  .check-row .badge { width: 14px; height: 14px; border-radius: 50%; display: inline-flex; align-items: center;
                      justify-content: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .check-row .badge.ok { background: #10b981; }
  .check-row .badge.warn { background: #f59e0b; }
  .small-btn { font-size: 11px; padding: 3px 9px; border: 1px solid #1E2761; background: #fff;
               color: #1E2761; border-radius: 3px; cursor: pointer; }
  .small-btn.primary { background: #1E2761; color: #fff; }
  /* --- launched instance view --- */
  .li-topbar { background: #1E2761; color: #fff; padding: 12px 24px; font-size: 13px;
               display: flex; justify-content: space-between; align-items: center; }
  .li-tabs { display: flex; gap: 0; background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 0 12px; }
  .li-tab { padding: 11px 16px; font-size: 12px; color: #6b7280; cursor: pointer; font-weight: 500;
            border-bottom: 2px solid transparent; }
  .li-tab:hover { color: #1E2761; }
  .li-tab.active { color: #1E2761; border-bottom-color: #1E2761; background: #fff; }
  .li-body { padding: 26px 32px 26px; min-height: 540px; background: #fff; }
  .li-footer { padding: 10px 24px; background: #f9fafb; border-top: 1px solid #e5e7eb;
               display: flex; justify-content: space-between; align-items: center; }
  .li-banner { background: #fef3c7; border: 1px solid #fbbf24; padding: 12px 16px;
               border-radius: 4px; font-size: 12px; color: #92400e; line-height: 1.5; margin-bottom: 22px; }
  .li-checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; }
  .li-checklist .check-row { padding: 10px 14px; background: #f9fafb; border-radius: 4px; font-size: 13px; }
  .li-link { color: #4f46e5; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .li-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
  .li-meta-card { padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fafafa; }
  .li-meta-label { font-size: 10px; font-weight: 700; color: #1E2761; text-transform: uppercase;
                   letter-spacing: 0.06em; margin-bottom: 6px; }
  .li-meta-value { font-size: 12px; color: #1f2937; margin-top: 2px; }
  .li-section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .li-section-head h3 { font-family: Georgia, serif; font-size: 20px; color: #1E2761; margin: 0; }
  .muted { color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <div class="brand">TCS · KNOWLEDGE FABRIC · INSTANCE LAUNCHER</div>
    <div class="step" id="stepLabel">Welcome</div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="body" id="content"></div>
</div>

<script>
// ----- per-screen state -----
const state = {
  cur: 0,
  customMode: false,        // step 1: are we in the Custom sub-flow?
  customBase: 'shipping',   // which radio is picked: 'blank' | 'shipping' | 'finance' | 'legal'
  expandedGrad: null,       // step 3: which scenario's graduation panel is open?
  launched: false,          // user clicked Launch on the Review screen → show the running instance
  launchedView: 'operator', // 'operator' | 'reviewer' | 'admin' — top-level mode in the launched instance
  adminTab: 'overview',     // when launchedView==='admin': 'overview' | 'ontology' | 'scenarios' | 'actions' | 'reviewers' | 'audit'
  packKind: 'populated',    // preview toggle: 'populated' (Shipping pack, busy state) | 'empty' (Custom blank slate)
  expandedStages: {1: true, 2: true, 3: true, 4: true}, // stage cards expanded/collapsed in the Scenarios build form
  testPanelOpen: false,     // "Test with sample data…" dashed panel in the Write actions build form
  editingRow: null,         // unique id of the row currently in inline-edit mode (null = none)
  extraInlineFacts: [],     // rows the user appended via "+ Add inline fact" in Stage 1
  reviewerTab: 'inbox',     // 'inbox' (pending decisions) | 'reviewed' (decided by me, undo window)
  reviewerActiveCase: 'C-3f7a2b', // selected case in the Inbox tab
  reviewerActiveReviewed: 'C-2a3b5d', // selected case in the Reviewed-by-me tab
  reviewerToast: null,      // {decision, caseId} shown briefly after a decision (or 'undo' kind)
  reviewerModal: null,      // null | 'reject' | 'rfi'
};

// ----- screen renderers -----
function screenWelcome() {
  return `<div class="eyebrow">Welcome</div>
   <h1>Launch a new Knowledge Fabric instance</h1>
   <p class="lede">6 quick questions. We'll generate a versioned <code>instance.yaml</code> you can git-commit and review with your team before anything goes live.</p>
   <div class="steps-overview">
     <div class="step-card"><div class="n">1</div><div class="l">Domain<br>pack</div></div>
     <div class="step-card"><div class="n">2</div><div class="l">Basics<br>+ region</div></div>
     <div class="step-card"><div class="n">3</div><div class="l">Decision<br>ladder</div></div>
     <div class="step-card"><div class="n">4</div><div class="l">Connectors</div></div>
     <div class="step-card"><div class="n">5</div><div class="l">Compliance</div></div>
     <div class="step-card"><div class="n">6</div><div class="l">Learned-rule<br>gate</div></div>
   </div>
   <p class="footer-tip">Estimated time: ~10 min · Output: a versioned config you can git-commit; no immediate prod changes.</p>

   <div style="margin-top: 22px; padding: 14px 18px; background: #eef2ff; border: 1.5px dashed #4f46e5; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 18px;">
     <div>
       <div style="font-size: 13px; font-weight: 600; color: #1E2761;">In a hurry? Use all defaults</div>
       <div style="font-size: 12px; color: #4b5563; margin-top: 4px; line-height: 1.5;">
         Skip the 6 questions and accept the sensible defaults: <b>Shipping pack · US East · Production tier · GDPR compliance · Standard learned-rule gate · all connectors except enterprise systems</b>. You can still review the generated config before launching anything.
       </div>
     </div>
     <button class="btn primary" style="white-space: nowrap; font-size: 13px; padding: 10px 18px;" onclick="state.cur = 7; render();">Skip to Review →</button>
   </div>`;
}

// Renders the "Enables in the running instance" callout that lands at
// the bottom of each step body. Connects launcher config → demo
// capability so the audience sees the through-line.
function enablesCallout(html) {
  return `<div class="enables-callout">
    <div class="enables-eyebrow">Enables in the running instance</div>
    <div class="enables-text">${html}</div>
  </div>`;
}

// Phrases used both on each step's callout AND on the Review screen
// summary. Defined once so the two surfaces never drift.
const ENABLES_PHRASES = {
  1: 'The ontology, the write actions, and the seed scenarios every running case binds against. <em>Foundation for every demoable capability below.</em>',
  2: "The agent's IAM scope shown on every case's Stage 1 (“policy &amp; scope”) row — every fact the agent reads or writes is gated by what you set here.",
  3: '<em>Authority recalculated; the one risky call escalated.</em> When a case crosses the ladder’s risk envelope, the harness demotes itself from auto-execute to human review and stamps the override on the audit trail.',
  4: '<em>Hidden tier-2 dependency surfaced before any decision.</em> Each connector becomes a source on the evidence map; multi-hop walks across them surface dependencies you wouldn’t see from any single system.',
  5: '<em>A decision re-versioned the moment new evidence arrived</em> — v1 stays sealed on the audit trail when v2 lands. <em>Reversible action cancelled and compensated, not stranded</em> — both halves paired on the same trail.',
  6: '<em>Invalid alternate rejected — same parent, lapsed qualification.</em> Promoted patterns become the harness’s instinct; that’s what separates the governed run from a naive baseline.',
};

function screenDomainPack() {
  if (state.customMode) return screenCustomPack();
  return `<div class="eyebrow">Step 1 of 6</div>
   <h1>Pick a domain pack</h1>
   <p class="lede">Each pack bundles an ontology, ~5–15 starter scenarios, a default review UI, and recommended policies. Pick the closest fit — you can fork and customize after launch.</p>
   <div class="cards">
     <div class="card selected"><h3>Shipping</h3><div class="count">11 scenarios · 16 ontology classes</div><ul><li>Supplier onboarding</li><li>Mode-switch / re-tender</li><li>Demurrage dispute</li><li>+ 8 more</li></ul></div>
     <div class="card"><h3>Legal</h3><div class="count">6 scenarios · 12 classes</div><ul><li>Contract clause review</li><li>NDA triage</li><li>Discovery prioritization</li><li>+ 3 more</li></ul></div>
     <div class="card"><h3>Healthcare</h3><div class="count">8 scenarios · 14 classes</div><ul><li>Prior-auth review</li><li>Care-plan adherence</li><li>Coding audit</li><li>+ 5 more</li></ul></div>
     <div class="card"><h3>Finance ops</h3><div class="count">7 scenarios · 10 classes</div><ul><li>Invoice exception</li><li>Expense audit</li><li>Reconciliation</li><li>+ 4 more</li></ul></div>
     <div class="card"><h3>HR</h3><div class="count">5 scenarios · 8 classes</div><ul><li>Hiring decision</li><li>Promotion review</li><li>Offboard checklist</li><li>+ 2 more</li></ul></div>
     <div class="card custom" onclick="state.customMode=true; render();"><h3>Custom →</h3><div class="count">Build your own</div><ul><li>Name your pack</li><li>Fork an existing pack or start blank</li><li>Choose visibility</li><li><b>Click to configure</b></li></ul></div>
   </div>
   ${enablesCallout(ENABLES_PHRASES[1])}`;
}

function screenCustomPack() {
  const baseOpts = [
    { id: 'blank',    title: 'Blank slate',        desc: 'Empty ontology, no starter scenarios. Most flexible; longest authoring time post-launch.' },
    { id: 'shipping', title: 'Fork: Shipping',     desc: 'Inherits 16 ontology classes + 11 starter scenarios. Edit / remove / add freely after launch.' },
    { id: 'finance',  title: 'Fork: Finance ops',  desc: 'Inherits 10 ontology classes + 7 scenarios.' },
    { id: 'legal',    title: 'Fork: Legal',        desc: 'Inherits 12 ontology classes + 6 scenarios.' },
  ];
  const baseRadios = baseOpts.map(o => `
    <div class="radio-row${state.customBase===o.id?' selected':''}" onclick="state.customBase='${o.id}'; render();">
      <div class="marker"></div>
      <div><div class="title">${o.title}</div><div class="desc">${o.desc}</div></div>
    </div>`).join('');

  const bottomBox = state.customBase === 'blank'
    ? `<div class="info-box">
         <b>Blank slate — the launched instance opens in build mode.</b> After you finish the launcher, the new instance opens with an empty ontology and no scenarios. A domain expert continues the build there: define classes, draft scenarios, configure write actions, then go live. <i>Reach the Review screen to launch the instance and see what that looks like.</i>
       </div>`
    : `<div class="info-box">
         You picked a fork. After launch, your pack starts with the forked pack's ontology + scenarios — your domain expert customises in the admin UI from there. Changes stay private to this instance.
       </div>`;

  return `<div class="eyebrow">Step 1 of 6 · Custom pack</div>
   <div class="crumb"><a onclick="state.customMode=false; state.customBase='shipping'; render();">← Back to pack picker</a></div>
   <h1>Build a custom domain pack</h1>
   <p class="lede">Set up the basics here. The ontology classes, scenarios, and write actions are authored in the admin UI after launch (so a domain expert can drive that, not the launcher).</p>

   <div class="form-row" style="max-width: 500px;">
     <label>Pack name</label>
     <input value="acme-pricing-ops">
     <p style="font-size: 11px; color: #6b7280; margin: 4px 0 0;">Used in audit logs, version history, and as a key in the config file.</p>
   </div>

   <div style="margin-top: 22px;">
     <label style="font-size: 10px; font-weight: 700; color: #1E2761; text-transform: uppercase; letter-spacing: 0.06em;">Base on existing pack</label>
     <div class="radio-group">${baseRadios}</div>
   </div>

   <div style="margin-top: 22px;">

      <p class="muted" style="font-size:13px; max-width:480px; margin:0 auto;">Once you approve, reject, or send a case back, it'll show up here with a 5-minute undo window.</p>
    </div>`;
  }

  if (!REVIEWED_BY_ME.find(c => c.id === state.reviewerActiveReviewed)) {
    state.reviewerActiveReviewed = REVIEWED_BY_ME[0].id;
  }
  const active = REVIEWED_BY_ME.find(c => c.id === state.reviewerActiveReviewed);
  const undoableCount = REVIEWED_BY_ME.filter(c => c.minutesAgo < UNDO_WINDOW_MINUTES).length;

  return `
    <div class="li-body" style="display:grid; grid-template-columns: 360px 1fr; gap: 14px; padding: 14px 24px;">
      <div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
          <div style="font-size:10px; font-weight:700; color:#1E2761; text-transform:uppercase; letter-spacing:0.05em;">${REVIEWED_BY_ME.length} cases decided · last 24 h</div>
          <div style="font-size:11px; color:#6b7280;">Sort: Newest ▾</div>
        </div>

        ${undoableCount > 0 ? `<div style="padding:8px 10px; background:#eef2ff; border-left:3px solid #4f46e5; margin-bottom:8px; font-size:11px; color:#4338ca; border-radius:0 4px 4px 0;">
          <b>${undoableCount}</b> recent decision${undoableCount === 1 ? '' : 's'} can still be undone (within the last ${UNDO_WINDOW_MINUTES} minutes).
        </div>` : ''}

        <div style="display:flex; flex-direction:column; gap:6px;">
          ${REVIEWED_BY_ME.map(c => reviewedCard(c, c.id === active.id)).join('')}
        </div>

        <div style="margin-top:12px; padding:10px; background:#f9fafb; border-radius:4px; font-size:11px; color:#6b7280; line-height:1.5;">
          <b>Undo window:</b> a decision can be reverted within ${UNDO_WINDOW_MINUTES} minutes. After that, an undo becomes a new "rationale-reversal" audit event — visible in the Admin · Audit tab.
        </div>
      </div>

      <div>${reviewedCaseDetail(active)}</div>
    </div>`;
}

function reviewedCard(c, isActive) {
  const cardBg = isActive ? '#eef2ff' : '#fff';
  const cardBorder = isActive ? '#4f46e5' : '#e5e7eb';
  const undoable = c.minutesAgo < UNDO_WINDOW_MINUTES;
  const remaining = UNDO_WINDOW_MINUTES - c.minutesAgo;
  return `<div style="padding:10px 12px; background:${cardBg}; border:1.5px solid ${cardBorder}; border-radius:4px; cursor:pointer; display:flex; flex-direction:column; gap:4px;"
              onclick="state.reviewerActiveReviewed='${c.id}'; render();">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
      <span style="font-family:'SF Mono', monospace; font-size:10px; color:#1E2761;">${c.id}</span>
      <span class="pill ${decisionPillCls(c.decision)}" style="font-size:9px;">${decisionLabel(c.decision)}</span>
    </div>
    <div style="font-size:11px; font-weight:600; color:#1f2937; line-height:1.35;">${c.title}</div>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
      <div style="font-size:10px; color:#6b7280;">${c.scenario} · ${ageLabel(c.minutesAgo)}</div>
      ${undoable
        ? `<button class="small-btn" style="font-size:10px; padding:2px 8px; border-color:#dc2626; color:#dc2626;"
                  onclick="event.stopPropagation(); undoDecision('${c.id}');">↺ Undo · ${remaining} min left</button>`
        : ''}
    </div>
  </div>`;
}

function reviewedCaseDetail(c) {
  const undoable = c.minutesAgo < UNDO_WINDOW_MINUTES;
  return `
    <div style="font-size:11px; color:#6b7280; margin-bottom:2px;">CASE · ${c.id} · ${c.by} submitted · decided ${ageLabel(c.minutesAgo)}</div>
    <h2 style="font-family: Georgia, serif; font-size:22px; margin:0 0 4px; color:#1E2761;">

    </h2>

      Scenario <b>${c.scenario}</b> · v4 · Decided by <b>procurement.lead.amorales</b> · <a class="li-link">Case spec →</a> · <a class="li-link">Audit entry →</a>

    <!-- decision summary banner -->
    <div style="padding:14px 18px; background:${c.decision==='approve' ? '#dcfce7' : c.decision==='reject' ? '#fee2e2' : '#fef3c7'};

        Your decision · ${ageLabel(c.minutesAgo)}
      </div>
      <div style="font-size:13px; color:#374151; margin-top:6px; line-height:1.5;">${c.rationale}</div>
      ${undoable
        ? `<div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
            <button class="small-btn" style="background:#dc2626; color:#fff; border-color:#dc2626; font-size:11px;"
                    onclick="undoDecision('${c.id}');">↺ Undo decision (${UNDO_WINDOW_MINUTES - c.minutesAgo} min left)</button>
            <span style="font-size:11px; color:#92400e;">Undoing returns the case to your Inbox and emits an audit event.</span>
          </div>`
        : `<div style="margin-top:8px; font-size:11px; color:#6b7280;"><i>Undo window closed (${ageLabel(c.minutesAgo - UNDO_WINDOW_MINUTES)} past the 5-min limit). A reversal would now require a "rationale-reversal" admin action.</i></div>`}
    </div>

    <!-- evidence the reviewer saw -->
    <div style="background:#f9fafb; padding:10px 14px; border-radius:4px; margin-bottom:10px;">
      <div style="font-size:10px; color:#6b7280; font-weight:600; margin-bottom:3px;">OPERATOR'S PROMPT</div>
      <div style="font-size:13px; color:#374151; font-style:italic;">"${operatorPromptFor(c.id)}"</div>
    </div>

    <div style="background:#f9fafb; padding:10px 14px; border-radius:4px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div style="font-weight:600; font-size:12px; color:#1E2761;">What the agent gathered</div>
      <div style="font-size:11px; color:#6b7280;"><b>3</b> stages · <b>11</b> facts</div>
    </div>

    ${stageBlock('Stage 1 · Policy & scope', 2, 'binder=intake')}
    ${stageBlock('Stage 2 · Agent gathered', 6, 'binder=proposal · 5 ontology queries')}
    ${stageBlock('Stage 3 · For your decision', 3, 'binder=review · 2 prior cases retrieved')}

    <!-- load-bearing facts the reviewer flagged -->
    <div style="margin-top:14px; padding:12px 14px; border:1px solid #e5e7eb; background:#fafafa; border-radius:4px;">
      <div style="font-size:11px; font-weight:600; color:#1E2761; margin-bottom:6px;">Facts you flagged as load-bearing</div>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${loadBearingChip('SanctionsProximity · SUP-001-PROX', true)}
        ${c.decision === 'reject' ? loadBearingChip('CarrierExposure · SUP-001-CARRIER', true) : ''}

    </div>`;
}

function operatorPromptFor(id) {
  // Tiny lookup so each reviewed-case detail shows a plausible prompt.
  return ({
    'C-2a3b5d': 'Please onboard Apex Industries as a tier-1 supplier for Q3 production.',
    'C-6e9f12': 'Re-tender booking BK-7032 to Lufthansa Cargo on the CN-DE air corridor.',
    'C-0c8b4e': 'Switch shipment S-700412 from ocean to air to recover the schedule.',
    'C-4e2b91': 'Onboard XYZ Components Ltd into the encryption-modules supplier pool.',
    'C-8d2c01': 'Expedite shipment S-8821 for Customer A — SLA at risk.',
    'C-1f2b7e': 'Reroute around Singapore port congestion — affects 12 in-transit shipments.',
    'C-9c5d10': 'Dispute demurrage charge D-2245 — $420 over 3 days.',
    'C-5a4e09': 'Switch shipment S-700288 to alternate routing for week-of-22 delivery.',
  })[id] || '—';
}

function undoDecision(caseId) {
  const idx = REVIEWED_BY_ME.findIndex(c => c.id === caseId);
  if (idx === -1) return;
  const c = REVIEWED_BY_ME[idx];
  if (c.minutesAgo >= UNDO_WINDOW_MINUTES) return; // safety
  REVIEWED_BY_ME.splice(idx, 1);
  // Put it back at the top of the inbox.
  REVIEWER_INBOX.unshift({
    id: c.id, scenario: c.scenario, title: c.title,
    age: 'just now', sla: '24h', slaPill: 'amber', by: c.by,
  });
  state.reviewerActiveReviewed = REVIEWED_BY_ME[0] ? REVIEWED_BY_ME[0].id : null;
  state.reviewerToast = { decision: 'undo', caseId: c.id };
  render();
}

function inboxCard(c, isActive) {
  const cardBg = isActive ? '#eef2ff' : '#fff';
  const cardBorder = isActive ? '#4f46e5' : '#e5e7eb';

}

    <!-- promoted-pattern advisory banner (Phase 3b) -->
    <div style="border-left:4px solid #4f46e5; background:linear-gradient(to right, #eef2ff, #fafafa); padding:10px 14px; margin-bottom:10px; border-radius:0 4px 4px 0;">
      <div style="font-size:10px; font-weight:700; color:#4f46e5; text-transform:uppercase; letter-spacing:0.05em;">Compounding loop · 1 learned rule matched</div>

        <span class="pill red" style="margin-right:6px;">REJECT</span>

        Which facts were load-bearing in your decision? <span class="muted" style="font-weight:normal;">· optional · pick up to 3</span>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${loadBearingChip('SanctionsProximity · SUP-001-PROX', true)}
        ${loadBearingChip('CarrierExposure · SUP-001-CARRIER', true)}
        ${loadBearingChip('PriorOverride · C-PP-007-001', false)}
        ${loadBearingChip('Product · P-HC-4421', false)}
        ${loadBearingChip('Supplier · SUP-001', false)}
        ${loadBearingChip('+ 8 more facts', false, true)}

    <!-- decision row (ACTIVE in reviewer mode) -->
    <div style="margin-top:14px; padding:14px; border:2px solid #fbbf24; border-radius:6px; background:#fffbeb;">

        <button class="small-btn" style="background:#10b981; color:#fff; border-color:#10b981; padding:6px 16px; font-weight:600;"

        <button class="small-btn" style="background:#dc2626; color:#fff; border-color:#dc2626; padding:6px 16px; font-weight:600;"
                onclick="state.reviewerModal='reject'; render();">✗ Reject</button>

function loadBearingChip(label, picked, faded) {

  return `<span style="padding:5px 10px; border-radius:999px; font-size:11px; cursor:pointer;
                  background:${picked ? '#fef3c7' : '#fff'}; border:1.5px ${picked ? 'solid #fbbf24' : 'dashed #d1d5db'};
                  color:${picked ? '#92400e' : '#6b7280'}; font-weight:${picked ? '600' : '500'}; opacity:${opacity};">${picked ? '✓ ' : '+ '}${label}</span>`;
}

function renderToast() {
  const t = state.reviewerToast;
  const isUndo = t.decision === 'undo';
  const labelMap = { approve: 'Approved', reject: 'Rejected', rfi: 'Sent back for more info', undo: 'Decision undone' };
  const bgMap    = { approve: '#10b981',   reject: '#dc2626',   rfi: '#f59e0b',                 undo: '#4f46e5' };
  const iconMap  = { approve: '✓',         reject: '✗',         rfi: '?',                       undo: '↺' };

  // Auto-advance only for forward decisions (not for undo).
  if (!isUndo) {
    setTimeout(() => {
      if (!state.reviewerToast || state.reviewerToast.decision === 'undo') return;
      const idx = REVIEWER_INBOX.findIndex(c => c.id === t.caseId);
      const next = REVIEWER_INBOX[idx === -1 ? 0 : (idx + 1) % REVIEWER_INBOX.length];
      state.reviewerActiveCase = next.id;
      state.reviewerToast = null;
      render();
    }, 2200);
  } else {
    // Undo toast clears after 3 seconds; no auto-advance.
    setTimeout(() => {
      if (state.reviewerToast && state.reviewerToast.decision === 'undo') {
        state.reviewerToast = null;
        render();
      }
    }, 3000);
  }

  const sub = isUndo
    ? 'Returned to your Inbox · audit event \"decision.undo\" recorded'
    : 'Stamped against scenario v4 · landing on audit trail · next case loading in 1s';

  return `<div style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#fff;
              border:1px solid #e5e7eb; border-radius:8px; padding:14px 18px; min-width:380px; max-width:520px;
              box-shadow:0 10px 30px rgba(0,0,0,0.15); z-index:9999; display:flex; align-items:center; gap:14px;">
    <div style="width:30px; height:30px; border-radius:50%; background:${bgMap[t.decision]}; color:#fff;
                display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;">${iconMap[t.decision]}</div>
    <div style="flex:1;">
      <div style="font-size:13px; font-weight:600; color:#1f2937;">${labelMap[t.decision]} · ${t.caseId}</div>
      <div style="font-size:11px; color:#6b7280; margin-top:2px;">${sub}</div>
    </div>
    <button class="small-btn" onclick="state.reviewerToast=null; render();" style="font-size:11px;">${isUndo ? 'Dismiss' : 'Stay (Esc)'}</button>
  </div>`;
}

function renderRationaleModal() {
  const kind = state.reviewerModal; // 'reject' | 'rfi'
  const isReject = kind === 'reject';
  const title = isReject ? 'Reject — provide a rationale' : 'Request more info';
  const accentBg = isReject ? '#dc2626' : '#f59e0b';
  const reasons = isReject
    ? ['Sanctions proximity too close — 3-hop OFAC SDN indirect ownership.', 'Carrier-alliance concentration: all preferred carriers in one alliance.', 'Reliability score below tier-1 threshold for this category.']
    : ['Need beneficial-ownership disclosure for Apex Holdings International.', 'Clarify ESG audit date — last documented audit > 12 months old.', 'Request second-source feasibility for primary SKU.'];

  return `<div onclick="if(event.target===this){state.reviewerModal=null; render();}"
              style="position:fixed; inset:0; background:rgba(31,41,55,0.6); z-index:9000;
                     display:flex; align-items:center; justify-content:center;">
    <div onclick="event.stopPropagation();" style="background:#fff; width:600px; max-width:90vw; border-radius:8px; overflow:hidden;
                box-shadow:0 20px 50px rgba(0,0,0,0.25);">
      <div style="background:${accentBg}; color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:10px; opacity:0.85; text-transform:uppercase; letter-spacing:0.06em; font-weight:700;">Reviewer rationale required</div>
          <div style="font-size:16px; font-weight:600; font-family:Georgia, serif;">${title}</div>
        </div>
        <a onclick="state.reviewerModal=null; render();" style="color:#fff; cursor:pointer; font-size:18px;">×</a>
      </div>
      <div style="padding:18px;">
        <div style="font-size:10px; font-weight:700; color:#1E2761; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;">Quick-pick reasons</div>
        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:14px;">
          ${reasons.map(r => `<button class="small-btn" style="text-align:left; padding:8px 12px; font-weight:normal; font-size:12px; line-height:1.4;">${r}</button>`).join('')}
        </div>
        <div style="font-size:10px; font-weight:700; color:#1E2761; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;">Reason</div>
        <textarea style="width:100%; min-height:80px; padding:8px 10px; border:1px solid #d1d5db; border-radius:4px; font-family:inherit; font-size:12px;" placeholder="Type or edit your rationale…">${reasons[0]}</textarea>
        ${isReject ? '' : `<div style="margin-top:12px; font-size:10px; font-weight:700; color:#1E2761; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;">Follow-up reminder</div>
        <div style="display:flex; gap:6px;">${['No follow-up','24 hours','3 days','1 week'].map((l,i)=>`<button class="small-btn${i===2?' primary':''}" style="font-size:11px;">${l}</button>`).join('')}</div>`}
      </div>
      <div style="padding:14px 18px; background:#f9fafb; border-top:1px solid #e5e7eb; display:flex; justify-content:flex-end; gap:8px;">
        <button class="small-btn" onclick="state.reviewerModal=null; render();">← Back to review</button>
        <button class="small-btn" style="background:${accentBg}; color:#fff; border-color:${accentBg}; font-weight:600; padding:6px 18px;"
                onclick="state.reviewerToast={decision:'${kind}', caseId:state.reviewerActiveCase}; state.reviewerModal=null; render();">

  return `<button class="small-btn" style="font-size:10px;" onclick="state.editingRow='${id}'; render();">Edit</button>`;

  if (state.editingRow === id) {

function screenDecisionLadder() {
  // Sample scenarios pulled from the chosen pack (Shipping).
  const scenarios = [
    { id: 'SC-PP-008', name: 'Supplier onboarding',                  action: 'supplier_onboarding_review', rev: 'amber', revLabel: 'Compensatable', ladder: 'propose', autoBlocked: false, defaultGrad: { approvals: 5, admin: true, nofm: false, local: true, siem: false } },
    { id: 'SC-LN-002', name: 'Mode-switch ocean → air',              action: 'retender_booking',           rev: 'red',   revLabel: 'Irreversible',  ladder: 'propose', autoBlocked: true },
    { id: 'SC-LN-DEMURRAGE-AUTO-025', name: 'Demurrage auto-dispute', action: 'waive_demurrage',           rev: 'green', revLabel: 'Compensatable', ladder: 'auto-act', autoBlocked: false, defaultGrad: { approvals: 3, admin: true, nofm: false, local: true, siem: true } },
    { id: 'SC-LN-ETA-PUSH-023', name: 'ETA push to customer',         action: 'push_eta',                   rev: 'green', revLabel: 'Idempotent',    ladder: 'auto-act', autoBlocked: false },
  ];

  const rows = scenarios.map(s => {
    const cells = ['observe','propose','auto-act'].map(state => {
      const disabled = (state === 'auto-act' && s.autoBlocked) ? ' disabled' : '';
      const sel = (s.ladder === state && !disabled) ? ' selected' : '';
      const label = (state === 'auto-act' && s.autoBlocked) ? 'Blocked<br>(irreversible)'
                  : (state === 'auto-act' && s.id === 'SC-LN-DEMURRAGE-AUTO-025') ? 'Auto-act<br>≤ $500 + prior win'
                  : state[0].toUpperCase() + state.slice(1);
      return `<div class="ladder-cell${sel}${disabled}">${label}</div>`;
    }).join('');

    const showGrad = state.expandedGrad === s.id;
    let gradPanel = '';
    if (showGrad && s.defaultGrad) {
      const g = s.defaultGrad;
      gradPanel = `
        <div class="grad-panel">
          <h4>Graduation rule · ${s.id}</h4>
          <p style="font-size: 11px; color: #6b7280; margin: 0 0 10px;">
            Conditions under which an admin can lift this scenario from Propose to Auto-act. Recorded as an audit event when the lift happens.
          </p>
          <div class="grad-field"><label>Successful HITL approvals required</label><input type="number" value="${g.approvals}"></div>
          <div class="grad-field"><label>Sign-off model</label>
            <div>
              <label style="font-weight: normal; text-transform: none; letter-spacing: 0; font-size: 12px;"><input type="checkbox" ${g.admin?'checked':''}> Admin must approve the lift</label><br>
              <label style="font-weight: normal; text-transform: none; letter-spacing: 0; font-size: 12px;"><input type="checkbox" ${g.nofm?'checked':''}> N-of-M reviewers must agree (N=2)</label>
            </div>
          </div>
          <div class="grad-field"><label>Audit destination</label>
            <div>
              <label style="font-weight: normal; text-transform: none; letter-spacing: 0; font-size: 12px;"><input type="checkbox" ${g.local?'checked':''}> Local audit log</label><br>
              <label style="font-weight: normal; text-transform: none; letter-spacing: 0; font-size: 12px;"><input type="checkbox" ${g.siem?'checked':''}> Stream to enterprise SIEM</label>
            </div>
          </div>
          <div class="grad-actions">
            <button class="primary" onclick="state.expandedGrad=null; render();">Save</button>
            <button onclick="state.expandedGrad=null; render();">Cancel</button>
            <button onclick="state.expandedGrad=null; render();" style="margin-left: auto; border-color: #b91c1c; color: #b91c1c;">Reset to platform default</button>
          </div>
        </div>`;
    }

    const editLink = s.defaultGrad
      ? `<div class="grad-line">Graduation rule: <b>${s.defaultGrad.approvals} HITL approvals</b> + ${s.defaultGrad.admin ? 'admin sign-off' : 'reviewer sign-off'}. <a onclick="state.expandedGrad='${state.expandedGrad === s.id ? '' : s.id}'; render();">${showGrad ? 'Close' : 'Edit ▾'}</a></div>`
      : `<div class="grad-line"><i>No graduation needed — already at ${s.ladder === 'auto-act' ? 'Auto-act' : s.ladder}.</i></div>`;

    return `
      <div class="scenario-row">
        <div class="scenario-row-top">
          <div>
            <div class="scenario-name">${s.name} (${s.id})</div>
            <div class="scenario-meta">Action: <code>${s.action}</code> · <span class="pill ${s.rev}">${s.revLabel}</span></div>
          </div>
          <div class="ladder">${cells}</div>
        </div>
        ${editLink}
        ${gradPanel}
      </div>`;
  }).join('');

  return `<div class="eyebrow">Step 3 of 6</div>
   <h1>Decision policy — the autonomy ladder</h1>
   <p class="lede">For each scenario, set the default autonomy state. <b>Observe</b> = log-only, no action. <b>Propose</b> = HITL review required. <b>Auto-act</b> = execute without review. The Auto-act cell is disabled when the action is irreversible.</p>
   <div style="margin-top: 14px;">${rows}</div>
   <p class="footer-tip">Graduation rules live <i>inline</i> on each scenario — click <a style="color:#4f46e5;">Edit ▾</a> to configure approvals + sign-off + audit. Click <a style="color:#4f46e5;">Edit ▾</a> on the first scenario to see the panel open.</p>
   ${enablesCallout(ENABLES_PHRASES[3])}`;
}

     <div class="card selected"><h3>Vector store (semantic search)</h3><div class="count">Read-only</div><ul><li>Policy / SOP corpus</li><li>Embeddings: OpenAI / Azure OpenAI</li></ul></div>
     <div class="card"><h3>Enterprise systems</h3><div class="count">SAP · Salesforce · ServiceNow</div><ul><li>Default reversibility: irreversible</li><li>Requires admin approval to write</li></ul></div>
     <div class="card"><h3>HTTP webhooks</h3><div class="count">Outbound notifications</div><ul><li>Slack · Teams · custom URLs</li><li>Per-tenant rate limits</li></ul></div>
   </div>
   ${enablesCallout(ENABLES_PHRASES[4])}`;
}

function screenCompliance() {

   <p class="lede">Pick a compliance template — flips audit retention, PII handling, immutability, and SIEM streaming together. Policies live <b>separate</b> from scenarios so customers can tighten governance without forking scenario YAML.</p>
   <div class="cards">
     <div class="card"><h3>None</h3><div class="count">Demos only</div><ul><li>30-day audit retention</li><li>No PII handling</li><li>Mutable cases</li></ul></div>

function screenLearnedRules() {
  return `<div class="eyebrow">Step 6 of 6</div>
   <h1>Evaluation gate for learned rules</h1>
   <p class="lede">
     Over time, the platform watches reviewers' decisions and notices patterns — e.g. "in 8 of 8 supplier-onboarding rejects, reviewers cited a sanctions-proximity issue." That recurring pattern can become a <b>learned rule</b>: an automatic hint shown on future similar cases.
     <br><br>
     <b>This step asks how strictly the platform should evaluate a learned rule before it goes live.</b> Stricter = fewer surprises but slower learning.
   </p>
   <div class="cards">
     <div class="card"><h3>Loose</h3><div class="count">Demo / sandbox</div><ul><li>Admin click → rule goes live</li><li>No replay against past cases</li><li>No regression check</li><li>(matches today's default)</li></ul></div>
     <div class="card selected"><h3>Standard</h3><div class="count">Recommended</div><ul><li>Replay against last 10 closed cases</li><li>≥ 70% of decisions would still match</li><li>Highlight any regressions before approval</li><li>Single admin sign-off</li></ul></div>
     <div class="card"><h3>Strict</h3><div class="count">Regulated domains</div><ul><li>Replay against last 100 closed cases</li><li>≥ 90% would still match</li><li>2 reviewer signoffs (N-of-M)</li><li>Mandatory rollback window</li></ul></div>
   </div>
   <div class="info-box">
     A <b>learned rule</b> is a "the reviewer almost always does X when Y is true" pattern that the platform proposes as a future-case hint. Admins still have to approve it. Demoting a learned rule is a one-click action with a full audit trail.
   </div>
   <p class="footer-tip">Tip: start at Standard. Lower to Loose only for internal sandbox tenants. Raise to Strict before any healthcare or trade-compliance workload.</p>
   ${enablesCallout(ENABLES_PHRASES[6])}`;
}

// ----- screen orchestration -----
const SCREEN_FNS = [
  screenWelcome,         // 0
  screenDomainPack,      // 1
  screenBasics,          // 2
  screenDecisionLadder,  // 3
  screenConnectors,      // 4
  screenCompliance,      // 5
  screenLearnedRules,    // 6
  screenReview,          // 7
];
const LABELS = ['Welcome','Step 1 · Domain pack','Step 2 · Basics','Step 3 · Decision ladder','Step 4 · Connectors','Step 5 · Compliance','Step 6 · Learned-rule gate','Review & launch'];

function render() {
  // After Launch: switch chrome entirely — no progress dots, no Back/Next.
  if (state.launched) {
    document.getElementById('progress').style.display = 'none';
    document.querySelector('.topbar').style.display = 'none';
    document.getElementById('content').style.padding = '0';
    document.getElementById('content').innerHTML = renderLaunchedInstance();
    return;
  }
  // Pre-launch: restore launcher chrome (in case user clicked "Back to launcher").
  document.getElementById('progress').style.display = 'flex';
  document.querySelector('.topbar').style.display = 'flex';
  document.getElementById('content').style.padding = '32px 40px 110px';

  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  for (let i = 0; i < SCREEN_FNS.length; i++) {
    const d = document.createElement('div');
    d.className = 'pdot' + (i < state.cur ? ' done' : i === state.cur ? ' active' : '');
    prog.appendChild(d);
  }
  document.getElementById('stepLabel').textContent = LABELS[state.cur];
  document.getElementById('content').innerHTML = SCREEN_FNS[state.cur]() + `
    <div class="nav">
      <button class="btn" id="back" ${state.cur===0?'disabled':''}>← Back</button>
      <button class="btn primary" id="next" ${state.cur===SCREEN_FNS.length-1?'disabled':''}>${state.cur===0?'Start →':'Next →'}</button>
    </div>`;
  document.getElementById('back').onclick = () => {
    if (state.cur === 1 && state.customMode) { state.customMode = false; render(); return; }
    if (state.cur > 0) { state.cur--; state.expandedGrad = null; render(); }
  };
  document.getElementById('next').onclick = () => {
    if (state.cur < SCREEN_FNS.length - 1) { state.cur++; state.expandedGrad = null; render(); }
  };
}
render();

// Esc cancels the reviewer's auto-advance or closes the rationale modal.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.reviewerToast) { state.reviewerToast = null; render(); }
  else if (state.reviewerModal) { state.reviewerModal = null; render(); }
});
</script>
