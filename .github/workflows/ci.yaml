name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  framework-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -e ./hitl-context
      - name: Framework verify_package smoke
        run: python hitl-context/tests/verify_package.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -e ./hitl-context
          pip install -e .[dev]
      - name: Pytest
        run: pytest tests/ -v
        env:
          JWT_SECRET: test-secret
          LLM_PROVIDER: fake
          HITL_DISABLE_RATE_LIMIT: "1"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check + build
        working-directory: frontend
        run: npm run build

  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check backend/ hitl-context/src/ tests/
