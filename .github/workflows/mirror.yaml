name: Mirror to Azure DevOps

# One-way mirror: GitHub (canonical) → Azure DevOps (read-only copy).
# Azure repo: agentic-ai/ai-agent/tcs_knowledge_fabric
#
# Required GitHub Actions secret:
#   AZURE_DEVOPS_PAT — Personal Access Token with Code (Read & Write) scope.
#     Generated at https://dev.azure.com/agentic-ai/_usersSettings/tokens
#
# Triggers: every push to main, manual dispatch, and a 6-hourly safety net.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

# Serialize mirror runs — two concurrent pushes to the same remote would race.
concurrency:
  group: mirror-azure
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-filter-repo

      - name: Mirror push to Azure DevOps
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_DEVOPS_PAT}" ]; then
            echo "::error::AZURE_DEVOPS_PAT secret is not set"
            exit 1
          fi
          # Bare mirror clone keeps refs clean (no refs/remotes/* leaking
          # into the target as branches the way actions/checkout would).
          git clone --mirror "https://github.com/${{ github.repository }}.git" repo.git
          cd repo.git
          # Strip the local-only tooling directory from all history before
          # pushing. Azure DevOps doesn't need it and the audience there
          # shouldn't see it. The filter is deterministic, so rewritten
          # SHAs stay stable across syncs until tracked content actually
          # changes. Note: Azure SHAs will not match GitHub SHAs as a result.
          git filter-repo --invert-paths --path .claude --force
          # Push branches + tags WITHOUT delete-ops. `--mirror` would
          # try to delete any branch present on Azure but absent on
          # GitHub (e.g. the Azure-only `Development` branch), which
          # branch policies block. The explicit refspecs below sync
          # every GitHub branch/tag onto Azure but leave Azure-only
          # refs untouched. Leading `+` is force (we rewrote history).
          #
          # `main` is also force-pushed onto Azure's `dev` and
          # `Development` branches so downstream consumers tracking
          # any of the three see the same tip on every sync. If a real
          # `dev` (or `Development`) branch is later created on GitHub,
          # the wildcard above will start carrying it instead — the
          # explicit `main->dev` / `main->Development` pushes then
          # become no-ops (already-up-to-date). The capital D in
          # `Development` matches the existing Azure-side branch name
          # exactly — git refs are case-sensitive.
          # Second Azure repo — tcs_knowledge_fabric_new_ui — receives
          # ONLY the launcher branch. Kept isolated so consumers
          # browsing the new-UI work don't see the full fabric history.
          # Runs BEFORE the main-repo push so a pre-existing ForcePush
          # denial on tcs_knowledge_fabric's `Development` branch (which
          # fails the script under `set -e`) doesn't block launcher →
          # new_ui from ever getting pushed. Same PAT + same
          # filter-repo pass, so .claude/ is stripped here too.
          AZURE_NEW_UI_URL="https://${AZURE_DEVOPS_PAT}@dev.azure.com/agentic-ai/ai-agent/_git/tcs_knowledge_fabric_new_ui"
          git push "${AZURE_NEW_UI_URL}" \
            '+refs/heads/launcher:refs/heads/launcher'

          AZURE_URL="https://${AZURE_DEVOPS_PAT}@dev.azure.com/agentic-ai/ai-agent/_git/tcs_knowledge_fabric"
          # Authoritative mirror — every branch + tag, plus main→dev. A real
          # failure here SHOULD still fail the job, so no `|| true`.
          git push "${AZURE_URL}" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/heads/main:refs/heads/dev'
          # main→Development is best-effort. Azure's `Development` branch has a
          # policy that denies ForcePush to the mirror PAT identity (TF401027),
          # so this ref is rejected on every run. That rejection must NOT fail
          # the whole mirror — every other ref above has already synced. Emit a
          # warning instead of exiting non-zero under `set -e`.
          git push "${AZURE_URL}" '+refs/heads/main:refs/heads/Development' \
            || echo "::warning::main->Development force-push denied by Azure branch policy (non-fatal; all other refs mirrored)"
