name: Mirror to Azure DevOps

# One-way mirror: GitHub (canonical) → Azure DevOps (read-only copy).
# Azure repo: agentic-ai/ai-agent/tcs_knowledge_fabric
#
# Required GitHub Actions secret:
#   AZURE_DEVOPS_PAT — Personal Access Token with Code (Read & Write) scope.
#     Generated at https://dev.azure.com/agentic-ai/_usersSettings/tokens
#
# Triggers: every push to main, manual dispatch, and a 6-hourly safety net.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

# Serialize mirror runs — two concurrent pushes to the same remote would race.
concurrency:
  group: mirror-azure
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-filter-repo

      - name: Mirror push to Azure DevOps
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_DEVOPS_PAT}" ]; then
            echo "::error::AZURE_DEVOPS_PAT secret is not set"
            exit 1
          fi
          # Bare mirror clone keeps refs clean (no refs/remotes/* leaking
          # into the target as branches the way actions/checkout would).
          git clone --mirror "https://github.com/${{ github.repository }}.git" repo.git
          cd repo.git
          # Strip the local-only tooling directory from all history before
          # pushing. Azure DevOps doesn't need it and the audience there
          # shouldn't see it. The filter is deterministic, so rewritten
          # SHAs stay stable across syncs until tracked content actually
          # changes. Note: Azure SHAs will not match GitHub SHAs as a result.
          git filter-repo --invert-paths --path .claude --force
          # Push branches + tags WITHOUT delete-ops. `--mirror` would
          # try to delete any branch present on Azure but absent on
          # GitHub (e.g. the Azure-only `Development` branch), which
          # branch policies block. The explicit refspecs below sync
          # every GitHub branch/tag onto Azure but leave Azure-only
          # refs untouched. Leading `+` is force (we rewrote history).
          #
          # `main` is also force-pushed onto Azure's `dev` branch so
          # downstream consumers tracking either branch see the same
          # tip on every sync. If a real `dev` branch is later created
          # on GitHub, the wildcard above will start carrying it
          # instead — the explicit `main->dev` push then becomes a
          # no-op (already-up-to-date).
          AZURE_URL="https://${AZURE_DEVOPS_PAT}@dev.azure.com/agentic-ai/ai-agent/_git/tcs_knowledge_fabric"
          git push "${AZURE_URL}" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/heads/main:refs/heads/dev'
