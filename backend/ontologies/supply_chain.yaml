id: supply_chain
title: Supply Chain (Neo4j demo)
namespace: sc
description: Graph-resident supply chain. Suppliers, their corporate parents
  and JV partners, the holding companies that link them to sanctioned-network
  shell entities, and the carriers + alliances they ship via. Purpose-built
  for decisions that need traversal (e.g. "is this supplier within 2 hops
  of an OFAC-listed entity?") which flat tables can't answer efficiently.
default: false
classes:
  Supplier:
    description: Vendor or producer of goods.
    plain_description: >-
      A company you buy from. Suppliers can own each other (parent /
      subsidiary), partner via joint ventures, sit under a holding
      company, and ship through preferred carriers.
    attributes:
    - name: supplier_id
      type: string
      identifier: true
      required: false
      description: null
    - name: name
      type: string
      identifier: false
      required: true
      description: null
    - name: country
      type: string
      identifier: false
      required: false
      description: null
    - name: reliability_score
      type: decimal
      identifier: false
      required: false
      description: null
    - name: status
      type: string
      identifier: false
      required: false
      description: Operational status. 'active' for going concerns; 'chapter_11_filed_YYYY-MM-DD'
        when bankruptcy protection has been filed. Used by the supply-assurance scenario
        to flag a supplier in distress before any decision.
    - name: qualification_status
      type: string
      identifier: false
      required: false
      description: Quality-system qualification state. 'qualified' for a current
        certification; 'lapsed' when the qualification has expired. Surfaced in the
        AlternativeSupplier summary so a reviewer can see at a glance that a proposed
        swap is invalid.
    - name: qualification_expires_on
      type: date
      identifier: false
      required: false
      description: Date the current qualification expires (or the date it expired,
        for 'lapsed' status).
    relations:
    - name: places
      target: PurchaseOrder
      cardinality: 0..*
      inverse: placed_with
      description: null
  PurchaseOrder:
    description: A confirmed order placed with a supplier.
    plain_description: >-
      A specific order you placed with a supplier — what was bought,
      for how much, and on what date.
    attributes:
    - name: po_id
      type: string
      identifier: true
      required: false
      description: null
    - name: total_value
      type: decimal
      identifier: false
      required: false
      description: null
    - name: placed_on
      type: date
      identifier: false
      required: false
      description: null
    relations:
    - name: contains
      target: Product
      cardinality: 1..*
      inverse: null
      description: null
  Product:
    description: A SKU sold to customers.
    plain_description: >-
      A finished product you sell or assemble (an SKU). Each product
      can be sourced from many suppliers, and tracing those layers is
      what the multi-tier visibility scenario does.
    attributes:
    - name: product_id
      type: string
      identifier: true
      required: false
      description: null
    - name: name
      type: string
      identifier: false
      required: false
      description: null
    - name: category
      type: string
      identifier: false
      required: false
      description: null
    relations: []
  SanctionedNetworkEntity:
    description: A node listed on an OFAC SDN (or equivalent) program. Lives
      in Neo4j as a target the agent fans out FROM when a fresh listing
      drops, and as a target the agent walks TO when vetting a supplier.
    plain_description: >-
      An entity on the OFAC sanctions list (Specially Designated
      Nationals or equivalent). The agent treats these as red flags:
      it checks whether new or existing suppliers are connected to
      one, even indirectly through a parent company or holding.
    attributes:
    - {name: entity_id, type: string, identifier: true}
    - {name: name, type: string}
    - {name: program, type: string}
    - {name: country, type: string}
    - {name: listed_at, type: date}
    - {name: risk_tier, type: string}
  SanctionsProximity:
    description: Result of a sanctions-proximity traversal. One row per
      shortest path from the queried Supplier to a SanctionedNetworkEntity
      within N hops. Surfaces the indirect-ownership trail flat tables miss
      (e.g. "Hemlock → Apex Metalworks → Apex Holdings → Shengli Shell").
    plain_description: >-
      How close a supplier sits to a sanctioned entity. The agent
      walks the corporate ownership graph and reports every sanctioned
      party reachable within a few hops, plus the chain of companies
      that connect them. This catches the indirect risk a name-only
      sanctions check would miss.
    attributes:
    - {name: entity_id, type: string, identifier: true}
    - {name: name, type: string}
    - {name: program, type: string}
    - {name: risk_tier, type: string}
    - {name: hop_distance, type: integer}
    - {name: path_via, type: string}
  AlliancePeer:
    description: Carrier-network reach. For each carrier the supplier ships
      via, the other carriers that share its alliance — used to surface
      concentration risk during onboarding (the supplier may "use multiple
      carriers" but they're all in the same alliance).
    plain_description: >-
      The "other carriers in the same alliance" as the ones a supplier
      already ships through. Useful for spotting concentration risk —
      a supplier may look diversified across carriers, but if all of
      them belong to one shipping alliance, a single disruption hits
      every lane.
    attributes:
    - {name: peer_carrier_id, type: string, identifier: true}
    - {name: peer_name, type: string}
    - {name: alliance_name, type: string}
    - {name: via_carrier, type: string}
  TierSupplier:
    description: >-
      A supplier reached at tier N when walking the multi-tier supply
      chain backwards from a Product. Tier 1 is the direct supplier that
      placed the PO; tier 2+ are reached by following SOURCES_FROM edges
      upstream. Surfaces deep-supply-chain dependencies (raw materials,
      sub-assemblies) that PO/CSV tables miss.
    plain_description: >-
      A supplier somewhere up your supply chain for a given product.
      "Tier 1" is the supplier you buy from directly; "Tier 2" is who
      THEY buy from; "Tier 3" is the layer beneath that. Knowing your
      tier-3 suppliers is how you find single-points-of-failure that
      a PO list can't show.
    attributes:
    - {name: tier_supplier_id, type: string, identifier: true}
    - {name: tier_supplier_name, type: string}
    - {name: country, type: string}
    - {name: tier, type: integer}
    - {name: reliability_score, type: decimal}
    - {name: chain, type: string}
  AlternativeSupplier:
    description: >-
      A swap candidate for a blocked / unavailable Supplier. Reached by
      walking three graph paths from the blocked node — (a) siblings via
      a shared controlling HoldingCompany, (b) siblings via a shared
      parent Supplier, (c) direct joint-venture partners. One row per
      candidate, with the relationship reasons combined and the shortest
      path distance.
    plain_description: >-
      A drop-in replacement when a supplier becomes unavailable (a
      sanctions hit, a failure, a price spike). The agent looks for
      candidates in three places: other suppliers owned by the same
      holding company, "siblings" sharing a parent supplier, and the
      blocked supplier's existing joint-venture partners — ranked by
      reliability.
    attributes:
    - {name: alt_supplier_id, type: string, identifier: true}
    - {name: alt_name, type: string}
    - {name: country, type: string}
    - {name: reliability_score, type: decimal}
    - {name: hop_distance, type: integer}
    - {name: via_relationship, type: string}
    - {name: qualification_status, type: string}
  UltimateBeneficialOwner:
    description: One row per node found along the ownership chain ABOVE the
      queried Supplier — every supplier ancestor reached via PARENT_OF and
      every HoldingCompany reached via CONTROLLED_BY. Used to answer
      "who ultimately owns SUP-XXX?" by surfacing the full UBO trail with
      hop distance and the control-percentage chain.
    plain_description: >-
      Who actually owns this supplier, all the way up. The agent walks
      the parent / holding chain step by step and reports the
      controlling shareholders at each level — answering the auditor's
      "who really owns SUP-XXX?" with the percentages and the path,
      not just the name on the invoice.
    attributes:
    - {name: owner_id, type: string, identifier: true}
    - {name: owner_name, type: string}
    - {name: owner_type, type: string}
    - {name: hop_distance, type: integer}
    - {name: control_pct, type: integer}
    - {name: chain, type: string}
  CarrierExposure:
    description: Carrier-fleet exposure to a newly-listed
      SanctionedNetworkEntity. Walks the corporate ownership graph from the
      SDN out to every Supplier within N hops, then surfaces every Carrier
      those Suppliers ship via. Surfaces second-order risk that flat tables
      can't see — "this carrier itself isn't sanctioned, but its biggest
      customer is a supplier whose parent owns 22% of the new SDN."
    plain_description: >-
      Which carriers are at risk when a new entity is sanctioned. The
      carrier itself isn't sanctioned, but if one of its biggest
      customers is a supplier connected to the new SDN, the carrier
      becomes exposed. The agent flags those carriers so compliance
      can decide whether to quarantine.
    attributes:
    - {name: carrier_id, type: string, identifier: true}
    - {name: name, type: string}
    - {name: alliance_name, type: string}
    - {name: hop_distance, type: integer}
    - {name: via_supplier, type: string}
    - {name: path_via, type: string}
  Program:
    description: A flagship customer program that consumes finished SKUs from one
      or more tier-1 suppliers. Used by the supply-assurance scenario to surface
      "which programs are exposed?" when a deep-tier supplier fails.
    plain_description: >-
      A named customer program (e.g. an avionics platform, a UAV
      sustainment contract). Each program consumes finished SKUs from
      tier-1 suppliers; tracking the program → SKU → supplier chain
      means a tier-2 disruption can be translated into the specific
      programs at risk and their dollar exposure.
    attributes:
    - {name: program_id, type: string, identifier: true}
    - {name: name, type: string}
    - {name: customer, type: string}
    - {name: revenue_at_risk_usd, type: decimal}
    - {name: otd_penalty_per_day_usd, type: decimal}
  DownstreamDependent:
    description: >-
      Reverse of TierSupplier — given a deep-tier supplier (typically one
      in distress), surface every downstream Supplier that sources from
      it directly or transitively via SOURCES_FROM. Each row is a (buyer,
      hops) pair with the chain back to the queried supplier. Used by
      the supply-assurance scenario to answer "who depends on the failing
      tier-2?" — the hidden-dependency reveal.
    plain_description: >-
      Which of your suppliers buy from a given upstream supplier — the
      mirror of multi-tier visibility. When a tier-2 or tier-3 supplier
      gets into trouble, this walk surfaces the tier-1s that depend on
      it, so you can see who'll feel the pain.
    attributes:
    - {name: buyer_id, type: string, identifier: true}
    - {name: buyer_name, type: string}
    - {name: country, type: string}
    - {name: hop_distance, type: integer}
    - {name: chain, type: string}
    - {name: reliability_score, type: decimal}
  ProgramImpact:
    description: >-
      For a given Supplier in distress, walk SOURCES_FROM upstream → PLACED
      → CONTAINS → INCLUDED_IN to surface every flagship Program whose SKUs
      depend on the supplier (directly or transitively). Returns one row
      per impacted Program with the revenue-at-risk and per-day OTD penalty
      so a reviewer sees the business stake in one shot.
    plain_description: >-
      Which customer programs lose ground when this supplier fails. Walks
      from the supplier outward through the SKUs and the tier-1s that
      buy them, ending at the program that consumes the SKU — so the
      business exposure (dollars at risk + daily penalties) is named on
      the audit trail before any decision.
    attributes:
    - {name: program_id, type: string, identifier: true}
    - {name: program_name, type: string}
    - {name: customer, type: string}
    - {name: revenue_at_risk_usd, type: decimal}
    - {name: otd_penalty_per_day_usd, type: decimal}
    - {name: via_suppliers, type: string}
    - {name: skus, type: string}
