id: SC-CUSTOM-Table_Structure_Overview
title: Table Structure Overview
domain: Custom data sources
autonomous: true
actor_id: agent-data-lookup
operator_role:
  label: Operator
  name: data.analyst
action_type: data_lookup
action_payload:
  source_id: outcome_stats
  ontology_type: OutcomeStat
  scope: data.read
match_keywords:
- schema details
- columns information
- database tables
- sqlite master
- table structure
interpreted_as: run a custom lookup against outcome_stats
clarifying_question: 'Would you like to run this lookup on the outcome_stats (ontology:
  OutcomeStat) data source?'
auto_approval_guardrail: GR-AUTO-LOOKUP
auto_approval_reason: Operator-saved query against 'outcome_stats'. Read-only within
  data.read scope.
closing_message: "Done \u2014 pulled rows from <code>outcome_stats</code> using the\
  \ saved <strong>Table Structure Overview</strong> query."
stages:
  agent_intake:
    binder: CustomLookupAgentBinder/1.0
    facts:
    - source: kf:graph
      ontology_type: Policy
      id: POL-AUTO-LOOKUP
      uri: kf.tcs/policy/POL-AUTO-LOOKUP
      title: Autonomous data lookup policy
      payload: Operator-saved queries against registered data sources are autonomous
        within data.read.
    - source: iam:scopes
      ontology_type: ActorScope
      id: agent-data-lookup
      uri: iam.tcs/actors/agent-data-lookup
      title: Actor scope
      payload: "Scopes: data.read \xB7 operator-saved scenario: SC-CUSTOM-Table_Structure_Overview"
  proposal:
    binder: CustomLookupProposalBinder/1.0
    queries:
    - data_source: outcome_stats
      ontology_type: OutcomeStat
      filter: {}
      purpose: 'Saved query: Table Structure Overview'
      sql_override: "-- Tables and their columns. Pick one and write real SQL against\
        \ it.\nSELECT m.name AS table_name,\n       GROUP_CONCAT(p.name || ' (' ||\
        \ p.type || ')', ', ') AS columns\nFROM sqlite_master m, pragma_table_info(m.name)\
        \ p\nWHERE m.type = 'table'\nGROUP BY m.name\nORDER BY m.name\nLIMIT :max_results"
outcomes:
  auto_execute:
    headline: "Auto-executed \u2014 Table Structure Overview"
    detail: Lookup against outcome_stats completed.
_custom_for_source: outcome_stats
_custom_suggested_prompt: Retrieve table structure information
