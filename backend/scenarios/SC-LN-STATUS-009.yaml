id: SC-LN-STATUS-009
title: Shipment status lookup
domain: Logistics & Network
autonomous: true
actor_id: agent-logistics-31
operator_role:
  label: Operator
  name: planner.lvenkat
action_type: shipment_status_lookup
action_payload:
  shipment_id: S-700499
  query_type: live_status
  scope: logistics.read
match_keywords:
- eta
- status
- where is
- track
- shipment status
- current status
- s-700499
- look up
interpreted_as: look up the current status and ETA on shipment S-700499
clarifying_question: Just to confirm — you want the current status and ETA on shipment
  <code>S-700499</code>. I'll bind it via <code>logistics.Shipment</code> against
  the registered <code>shipments_csv</code> source.<br><br> This is a read-only query
  within my <code>logistics.read</code> scope; per policy <code>GR-LN-AUTO-001</code>,
  no human review is required. Proceed?
auto_approval_guardrail: GR-LN-AUTO-001
auto_approval_reason: Read-only logistics query within agent scope. Policy GR-LN-AUTO-001
  permits autonomous status checks.
closing_message: Done — the status query was auto-approved by <code>GR-LN-AUTO-001</code>
  (read-only within my scope). Shipment record was bound from <code>shipments_csv</code>
  via <code>logistics.Shipment</code>; see the audit trail for per-fact provenance.
stages:
  agent_intake:
    binder: PolicyAndScopeAgentBinder/1.0
    facts:
    - source: kf:graph
      ontology_type: Policy
      id: POL-LN-READONLY-2026
      uri: kf.tcs/policy/POL-LN-READONLY-2026
      title: Read-only logistics policy
      payload: Read-only queries (status, ETA, lane data) are autonomous within logistics.read
        scope. No human review required.
    - source: iam:scopes
      ontology_type: ActorScope
      id: agent-logistics-31
      uri: iam.tcs/actors/agent-logistics-31
      title: Actor scope
      payload: 'Scopes: logistics.read, logistics.propose, logistics.tender_after_review
        · this query: logistics.read only'
  proposal:
    binder: ShipmentLookupProposalBinder/2.0-live
    ontology_queries:
    - ontology: logistics
      class: Shipment
      where:
        shipment_id: :shipment_id
      purpose: Bind live shipment record (via logistics.Shipment → shipments_csv)
outcomes:
  auto_execute:
    headline: Auto-executed — status retrieved
    detail: Shipment record bound from shipments_csv via logistics.Shipment. ETA,
      vessel, position, and port congestion are on the envelope.
version: 1
plain_summary: "Check where a shipment is and its current status."
