id: SC-LN-DEMURRAGE-AUTO-025
title: 'Auto-dispute small demurrage charges (envelope: <$500 + prior wins)'
domain: Logistics & Network
autonomous: true
actor_id: agent-logistics-31
operator_role:
  label: Operator
  name: planner.lvenkat
action_type: dispute_demurrage_charge
action_payload:
  charge_id: DEM-S-700499-SMALL
  shipment_id: S-700499
  port_code: NLRTM
  claim_amount_usd: 385
  scope: logistics.write_carrier_dispute_low
match_keywords:
- auto dispute
- auto-dispute
- small demurrage
- low value dispute
- auto challenge
- envelope dispute
- auto-file dispute
interpreted_as: auto-file a dispute on the small demurrage charge DEM-S-700499-SMALL
  ($385) per the envelope policy
clarifying_question: 'Confirm — auto-file a dispute on charge <code>DEM-S-700499-SMALL</code>
  ($385 detention on shipment <code>S-700499</code> at NLRTM). Envelope per <code>GR-LN-AUTO-DEM-003</code>:
  total &lt; $500 AND prior_dispute_outcome=won on similar charges. I''ll bind the
  target charge, the source shipment, and a sample of historically waived small charges
  (status=waived AND prior=won AND total ≤ $500) as the evidence pattern. No human
  review required if envelope holds. Proceed?'
auto_approval_guardrail: GR-LN-AUTO-DEM-003
auto_approval_reason: Charge under $500 AND prior carrier dispute outcomes are 'won'
  for this lane. Policy GR-LN-AUTO-DEM-003 permits autonomous dispute filing for low-risk
  recoveries.
closing_message: Done — auto-disputed via <code>dispute_demurrage_charge</code>. HTTP
  POST fired to the carrier claims API. The envelope was grounded in the historical
  win pattern on this lane; execution result + audit event on the lineage.
stages:
  agent_intake:
    binder: PolicyAndScopeAgentBinder/1.0
    facts:
    - source: kf:graph
      ontology_type: Policy
      id: GR-LN-AUTO-DEM-003
      uri: kf.tcs/policy/GR-LN-AUTO-DEM-003
      title: Autonomous low-value demurrage dispute policy
      payload: Agent may auto-file disputes when total_charge_usd < 500 AND there
        is at least one prior carrier dispute on a similar charge with prior_dispute_outcome='won'.
        All other disputes (≥$500 or no win history) route to HITL via SC-LN-DEMURRAGE-DISPUTE-024.
    - source: iam:scopes
      ontology_type: ActorScope
      id: agent-logistics-31
      uri: iam.tcs/actors/agent-logistics-31
      title: Actor scope
      payload: 'Scopes: logistics.read, logistics.write_carrier_dispute_low · http_request
        to the carrier claims API permitted within envelope'
  proposal:
    binder: AutoDemurrageProposalBinder/1.0
    ontology_queries:
    - ontology: logistics
      class: DemurrageCharge
      where:
        charge_id: :charge_id
      purpose: Bind the charge being auto-disputed
    - ontology: logistics
      class: Shipment
      where:
        shipment_id: :shipment_id
      purpose: Source shipment + carrier context
    - ontology: logistics
      class: DemurrageCharge
      where:
        status: waived
        prior_dispute_outcome: won
        max_total_usd: 500
      max_results: 5
      purpose: 'Historical pattern grounding the envelope: small waived charges with
        prior wins (status=waived AND prior=won AND total ≤ $500)'
outcomes:
  auto_execute:
    headline: Auto-executed — dispute filed within envelope
    detail: Charge under threshold and prior dispute pattern positive. dispute_demurrage_charge
      ran; HTTP response status captured.
_executor:
  action_id: dispute_demurrage_charge
  arguments:
    charge_id: DEM-S-700499-SMALL
    shipment_id: S-700499
    dispute_reason: Auto-filed per GR-LN-AUTO-DEM-003 — charge under $500 + prior
      carrier dispute outcomes positive on this lane
    claim_amount_usd: '385'
_filter_from_prompt: true
version: 1
plain_summary: "Automatically dispute small port storage fees within a preset limit."
