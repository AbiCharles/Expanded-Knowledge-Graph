id: SC-LN-002
title: Mode-switch — ocean → air on critical lane
domain: Logistics & Network
teams_channel: '#logistics-planning'
actor_id: agent-logistics-31
operator_role:
  label: Operator
  name: planner.tgupta
reviewer_role:
  label: Reviewer
  name: logistics.planner.lead
autonomous: false
action_type: switch_mode
action_payload:
  shipment_id: S-700412
  booking_id: BK-700412-01
  order_id: ORD-44218
  lane_id: L-CNSHA-DEHAM
  mode_from: ocean
  mode_to: air
  current_carrier_id: CR-MSCU
  new_carrier_id: CR-LHCA
  cost_uplift_pct: 18.0
  schedule_recovery_days: 11
  originating_guardrail_id: SC-LN-002
teams_headline: Ocean → air mode switch · lane CN-DE
execute_message: Approve to update the active booking for <code>S-700412</code> from
  ocean (MSC) to air (Lufthansa Cargo) on lane <code>L-CNSHA-DEHAM</code>. The <code>retender_booking</code>
  action runs against <code>logistics.sqlite</code>; customer SLA + recovery rationale
  captured in lineage.
match_keywords:
- switch
- ocean
- air
- expedite
- mode
- s-700412
- hamburg
- shanghai
- shipment
- recover
- mode switch
- swap mode
interpreted_as: switch shipment S-700412 from ocean to air to recover the schedule
clarifying_question: Confirm — switch shipment <code>S-700412</code> (Shanghai → Hamburg)
  from ocean (booking <code>BK-700412-01</code>, MSC) to air (Lufthansa Cargo) to
  recover ~11 days. Cost uplift ~+18%; customer is Wayne Enterprises on a premium
  SLA. I'll bind the current booking, both carriers' scorecards, the customer order,
  and the ocean + air rate cards on this lane so you can weigh the call. Proceed?
closing_messages:
  approve: <strong>Planner approved the switch.</strong> One-time air upgrade authorized
    given customer SLA exposure. They flagged the lane for structural review given
    the recurring pattern. The <code>retender_booking</code> action ran and the booking
    row is now tendered to Lufthansa.
  reject: '<strong>Planner rejected the switch.</strong> Reason given: <em>"{rationale}"</em><br><br>Customer
    is being notified of revised ETA via the original ocean booking; no DB change.'
  request_more_info: '<strong>Planner needs more information.</strong> Specifically:
    <em>"{rationale}"</em><br><br>Case is back in review with these added queries.'
rationale_reasons:
  reject:
  - Recurring lane pattern — needs a structural fix, not another point fix.
  - Customer SLA exposure does not justify setting this precedent.
  - Cost recovery analysis is insufficient given the budget envelope.
  request_more_info:
  - Need the structural lane review status from the planning team.
  - Need an alternative ocean carrier quote before deciding.
  - Need customer notification options if we hold to the original booking.
stages:
  agent_intake:
    binder: LogisticsPlanningAgentBinder/2.0-live
    facts:
    - source: kf:graph
      ontology_type: Policy
      id: POL-LN-MODESWITCH-2026
      uri: kf.tcs/policy/POL-LN-MODESWITCH-2026
      title: Mode-switch policy
      payload: Cost uplift up to 25% within envelope · still requires planner approval
        · log all switches
    - source: iam:scopes
      ontology_type: ActorScope
      id: agent-logistics-31
      uri: iam.tcs/actors/agent-logistics-31
      title: Actor scope
      payload: 'Scopes: logistics.read, logistics.propose, logistics.tender_after_review'
  proposal:
    binder: ModeSwitchProposalBinder/2.0-live
    ontology_queries:
    - ontology: logistics
      class: Booking
      where:
        shipment_id: :shipment_id
      purpose: Current active booking on this shipment (logistics.Booking → logistics_sqlite)
    - ontology: logistics
      class: Shipment
      where:
        shipment_id: :shipment_id
      purpose: Shipment record (origin/dest/cargo, current variance)
    - ontology: logistics
      class: Carrier
      where:
        carrier_id: :current_carrier_id
      purpose: Current carrier scorecard
    - ontology: logistics
      class: Carrier
      where:
        carrier_id: :new_carrier_id
      purpose: Proposed air-carrier scorecard
    - ontology: logistics
      class: FreightRate
      where:
        lane_id: :lane_id
      max_results: 6
      purpose: Both ocean + air rate cards on this lane for cost comparison
    - ontology: logistics
      class: BookingHistory
      where:
        booking_id: :booking_id
      max_results: 3
      purpose: Recent changes to this booking — surfaces 'previously changed from
        X to Y' on replay
  review:
    binder: ModeSwitchReviewBinder/2.0-live
    ontology_queries:
    - ontology: logistics
      class: CustomerOrder
      where:
        order_id: :order_id
      purpose: Customer order — SLA tier + penalty exposure
    - ontology: tcs_core
      class: PriorOverride
      where:
        scenario_id: SC-LN-002
      max_results: 3
      purpose: Prior mode-switch decisions on similar lanes (governance)
outcomes:
  approve:
    headline: Approved — air freight authorized
    detail: Planner approved one-time air upgrade given customer SLA exposure. retender_booking
      action ran; booking now tendered to Lufthansa.
  reject:
    headline: Rejected — switch denied
    detail: Planner rejected the mode switch. Cost recovery does not justify the precedent
      given recurring pattern. Customer to be notified of revised ETA.
  request_more_info:
    headline: More information requested
    detail: Reviewer asked for the structural lane review status and an alternative
      ocean carrier quote before deciding. Case loops back to review.
_executor:
  action_id: retender_booking
  arguments:
    booking_id: BK-700412-01
    new_carrier_id: CR-LHCA
    new_total_cost_usd: 13570
    new_status: tendered
version: 1
plain_summary: "Switch a critical shipment from ocean to air freight to make up lost time."
