sources:
- id: products_csv
  kind: csv
  path: backend/data/products.csv
  id_field: product_id
  title_field: name
  summary_template: "ECCN {eccn} \xB7 HTS {hts} \xB7 {description}"
  default: true
  description: Sample product master data (15 rows incl. P-EL-9001 encryption module)
- id: sanctions_csv
  kind: csv
  path: backend/data/sanctions_sdn_sample.csv
  id_field: ent_id
  title_field: name
  summary_template: "{programs} \xB7 {sdn_type} \xB7 {country} \xB7 added {first_seen}"
  default: true
  description: Synthetic OFAC-style SDN list (~30 entries, schema-compatible with
    the real feed)
- id: governance_sqlite
  kind: sqlite
  path: backend/data/governance.sqlite
  sample_filter:
    scenario_id: SC-TC-007
  default: true
  description: 'Governance audit store: prior reviewer decisions. SQL is now in the
    tcs_core mapping doc.'
- id: public_jsonplaceholder
  kind: http
  base_url: https://jsonplaceholder.typicode.com
  default: true
  description: "Public test API (https://jsonplaceholder.typicode.com) \u2014 confirms\
    \ HTTP connector works without keys. Path templates live in mappings."
- id: policy_corpus
  kind: vector_store
  folder: backend/data/policy_corpus/
  index_path: backend/data/policy_corpus.npz
  top_k: 3
  embed_model: text-embedding-3-small
  default: true
  description: Vector store over 5 policy/SOP markdown excerpts; semantic retrieval
    via OpenAI embeddings
- id: governance_postgres
  kind: postgres
  dsn: postgresql://hitl:hitl@localhost:5432/governance
  sample_filter:
    scenario_id: SC-TC-007
  description: 'Postgres governance store (local docker-compose.postgres.yaml): same
    prior_cases schema as the SQLite store, swappable connector. SQL lives in the
    mapping doc when bound.'
- id: neo4j_default
  kind: neo4j
  uri: bolt://localhost:7687
  password: YcV7wquQWdFLKZDRwck3CqlbD0W_c1fAV0U2cpMl578
  user: neo4j
  description: Auto-registered from NEO4J_* env vars (bolt://localhost:7687)
