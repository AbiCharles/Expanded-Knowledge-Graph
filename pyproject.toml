[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-context-app"
version = "0.1.0"
description = "Full-stack HITL Context Framework — FastAPI backend + React frontend, OpenAI/Azure-pluggable agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tcs-hitl-context",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.0",
  "pyyaml>=6.0",
  "openai>=1.30",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "bcrypt>=4.1",
  "python-jose[cryptography]>=3.3",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.uv.sources]
tcs-hitl-context = { path = "hitl-context", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "hitl-context/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
