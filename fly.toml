# fly.toml app configuration file generated for tcs-knowledge-fabric on 2026-05-24T18:34:20-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tcs-knowledge-fabric'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    # W8 — bake the agent-orchestrator companion service URL into the
    # frontend bundle. The /agent-run route's api.ts uses this to hit
    # the right origin for POST /api/agent-run/start + SSE.
    VITE_AGENT_ORCHESTRATOR_URL = 'https://tcs-agent-orchestrator.fly.dev'

[env]
  LLM_PROVIDER = 'fake'
  LOG_LEVEL = 'INFO'

[[mounts]]
  source = 'hitl_data'
  destination = '/app/backend/data'

[http_service]
  internal_port = 8001
  force_https = true
  # Keep at least one machine warm so the /launcher page and every /api
  # call return in <500 ms instead of triggering a ~12 s cold start.
  # Cost trade: one shared-1x machine running 24/7 (~$5/mo on Fly).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
