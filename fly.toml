# fly.toml app configuration file generated for tcs-knowledge-fabric on 2026-05-24T18:34:20-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tcs-knowledge-fabric'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  LLM_PROVIDER = 'fake'
  LOG_LEVEL = 'INFO'

[[mounts]]
  source = 'hitl_data'
  destination = '/app/backend/data'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
